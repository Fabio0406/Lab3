name: CI - Nightly - Spring Boot DevSecOps

on:
  schedule:
    - cron: '55 20 * * *'  # Runs every day at 20:55
      timezone: 'America/La_Paz'
  workflow_dispatch:

permissions:
  contents: read

env:
  JAVA_VERSION: '21'
  MAVEN_OPTS: '-Xmx2g'

jobs:
  # ------------------------------------------------------------------
  # 1. Build + Unit/Integration Tests + Code Coverage
  # ------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Needed for Sonar / CodeQL history

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build & run tests with coverage
        run: |
          mvn -B clean verify \
              -DskipITs=false \
              org.jacoco:jacoco-maven-plugin:prepare-agent \
              org.jacoco:jacoco-maven-plugin:report

      - name: Upload test & coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-and-coverage-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
            target/failsafe-reports/
          retention-days: 7

  # ------------------------------------------------------------------
  # 2. Static Application Security Testing (SAST) - CodeQL
  # ------------------------------------------------------------------
  sast-codeql:
    name: SAST - CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-and-quality

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"

  # ------------------------------------------------------------------
  # SAST - Semgrep (reglas auto + reglas del laboratorio)
  # ------------------------------------------------------------------
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config auto \
            --config .semgrep.yml \
            --json-output=semgrep-results.json \
            --sarif-output=semgrep-results.sarif \
            src/main/java

      - name: Upload Semgrep reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-reports
          path: |
            semgrep-results.json
            semgrep-results.sarif
          if-no-files-found: warn
          retention-days: 14

  # ------------------------------------------------------------------
  # 3. Software Composition Analysis (SCA) - Dependency vulnerabilities
  # ------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      # failBuildOnCVSS=11 nunca corta el job: los hallazgos los evalua el Quality Gate
      - name: Run OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ -n "$NVD_API_KEY" ]; then EXTRA_ARGS="-DnvdApiKey=$NVD_API_KEY"; fi
          mvn -B org.owasp:dependency-check-maven:check \
              -Dformats=HTML,JSON \
              -DfailBuildOnCVSS=11 $EXTRA_ARGS

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: |
            target/dependency-check-report.html
            target/dependency-check-report.json
          retention-days: 14

  # ------------------------------------------------------------------
  # 4. Optional: SpotBugs + PMD (static analysis)
  # ------------------------------------------------------------------
  static-analysis:
    name: Static Analysis (SpotBugs + PMD)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Run SpotBugs & PMD
        run: |
          mvn -B clean compile com.github.spotbugs:spotbugs-maven-plugin:spotbugs
          mvn -B org.apache.maven.plugins:maven-pmd-plugin:pmd || true

      - name: Upload SpotBugs / PMD reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-analysis-reports
          path: |
            target/spotbugsXml.xml
            target/pmd.xml
          retention-days: 7

  # ------------------------------------------------------------------
  # 5. Quality Gate - lee los reportes y falla si hay hallazgos criticos
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [build-and-test, sast-codeql, semgrep, static-analysis, sca-dependency-check]
    if: always()
    steps:
      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Evaluate job results and reports
        run: |
          FAIL=0
          SEMGREP_REPORT=reports/semgrep-reports/semgrep-results.json
          SPOTBUGS_REPORT=reports/static-analysis-reports/spotbugsXml.xml
          DC_REPORT=reports/dependency-check-report/dependency-check-report.json

          echo "Build & Test: ${{ needs.build-and-test.result }}"
          echo "CodeQL:       ${{ needs.sast-codeql.result }}"

          if [[ "${{ needs.build-and-test.result }}" != "success" ]]; then
            echo "::error::Build or tests failed"
            FAIL=1
          fi

          if [[ "${{ needs.sast-codeql.result }}" != "success" ]]; then
            echo "::error::CodeQL analysis failed"
            FAIL=1
          fi

          echo "## Quality Gate" >> "$GITHUB_STEP_SUMMARY"
          echo "| Herramienta | Hallazgos criticos |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          # Semgrep: hallazgos con severidad ERROR
          if [[ -s "$SEMGREP_REPORT" ]]; then
            SEMGREP=$(jq '[.results[] | select(.extra.severity == "ERROR")] | length' "$SEMGREP_REPORT")
            echo "| Semgrep (ERROR) | $SEMGREP |" >> "$GITHUB_STEP_SUMMARY"
            if (( SEMGREP > 0 )); then
              echo "::error::Semgrep: $SEMGREP hallazgos con severidad ERROR"
              jq -r '.results[] | select(.extra.severity == "ERROR") | "  - \(.check_id) \(.path):\(.start.line)"' "$SEMGREP_REPORT"
              FAIL=1
            fi
          else
            echo "::error::No se encontro el reporte de Semgrep"
            FAIL=1
          fi

          # SpotBugs: bugs de prioridad 1 (alta)
          if [[ -s "$SPOTBUGS_REPORT" ]]; then
            SPOTBUGS=$(grep -c '<BugInstance[^>]*priority="1"' "$SPOTBUGS_REPORT" || true)
            echo "| SpotBugs (prioridad 1) | $SPOTBUGS |" >> "$GITHUB_STEP_SUMMARY"
            if (( SPOTBUGS > 0 )); then
              echo "::error::SpotBugs: $SPOTBUGS bugs de prioridad alta"
              FAIL=1
            fi
          else
            echo "::error::No se encontro el reporte de SpotBugs"
            FAIL=1
          fi

          # Dependency-Check: vulnerabilidades CRITICAL
          if [[ -s "$DC_REPORT" ]]; then
            DC=$(jq '[.dependencies[].vulnerabilities[]? | select((.severity // "") | ascii_upcase == "CRITICAL")] | length' "$DC_REPORT")
            echo "| Dependency-Check (CRITICAL) | $DC |" >> "$GITHUB_STEP_SUMMARY"
            if (( DC > 0 )); then
              echo "::error::Dependency-Check: $DC vulnerabilidades CRITICAL"
              jq -r '.dependencies[] | .fileName as $f | .vulnerabilities[]? | select((.severity // "") | ascii_upcase == "CRITICAL") | "  - \(.name) \($f)"' "$DC_REPORT"
              FAIL=1
            fi
          else
            echo "::error::No se encontro el reporte de Dependency-Check"
            FAIL=1
          fi

          if (( FAIL == 1 )); then
            echo "Quality gate failed"
            exit 1
          fi
          echo "Quality gate passed"
